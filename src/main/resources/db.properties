# ---- Option 1 (default): embedded H2 database, zero setup ----
# The data file is created automatically in your home folder: ~/tempo-data/tempo.mv.db
db.url=jdbc:h2:~/tempo-data/tempo;MODE=MySQL;DB_CLOSE_DELAY=-1
db.user=sa
db.password=

# ---- Option 2: MySQL 8 (create the empty database once:  CREATE DATABASE goal_tracker; ) ----
# Comment out the three H2 lines above and uncomment these:
#db.url=jdbc:mysql://localhost:3306/goal_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#db.user=root
#db.password=YOUR_MYSQL_PASSWORD

# For hosting, do NOT put passwords in this file: set environment variables
# DB_URL, DB_USER, DB_PASSWORD instead (they override everything above).
